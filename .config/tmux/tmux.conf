# Initial setup
set -g default-terminal "tmux-256color"
set -g status-keys vi
set -g mouse on
set-option -g prefix C-x
set-option -g prefix2 C-b

# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message ".tmux.conf reloaded"

unbind M-Left
unbind M-Right

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R

bind -n M-b select-pane -L   # Option+Left on macOS typically sends M-b
bind -n M-f select-pane -R   # Option+Right sends M-f

bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift-arrow to without prefix key to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Set easier window split keys
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# bind -r C-Down resize-pane -D 5
# bind -r C-Up resize-pane -U 5
# bind -r C-Right resize-pane -R 7
# bind -r C-Left resize-pane -L 5

bind -r m resize-pane -Z


# Easily reorder windows with CTRL+SHIFT+Arrow
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Synchronize panes
bind-key y set-window-option synchronize-panes \; display-message "Synchronize mode toggled."

# Lengthen the amount of time status messages are displayed
set-option -g display-time 2000
set-option -g display-panes-time 2000

# set -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S '

# Set the base-index to 1 rather than 0
set -g base-index 1
set-window-option -g pane-base-index 1

# Allow the arrow key to be used immediately after changing windows.
set-option -g repeat-time 0

# No delay for escape key press
set -sg escape-time 0

# Always start zsh in new panes/windows
set-option -g default-command "zsh"


# Pick a softer palette.
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_text " #W"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

##### Display Popups ##### 

bind g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"


bind : display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"
